<script>
  async function getAccessToken(code) {
    const codeVerifier = sessionStorage.getItem('code_verifier');

    const body = new URLSearchParams({
      client_id: '0f563b1a49f648e383eae725198d3bbf',
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: 'https://tanisha-gandhi.github.io/tina-turn-it-up/callback.html',
      code_verifier: codeVerifier
    });

    const response = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    });

    const data = await response.json();

    if (data.access_token) {
      document.getElementById('token').textContent = 'Access Token:\n' + data.access_token;
      // Save token for API calls, e.g. sessionStorage.setItem('access_token', data.access_token);
    } else {
      document.getElementById('token').textContent = 'Error getting token: ' + JSON.stringify(data);
    }
  }

  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code) {
    getAccessToken(code);
  } else {
    document.getElementById('token').textContent = 'No code found in URL. Please login first.';
  }
</script>
